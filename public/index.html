<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
<script src="redirectToDebug.js"></script>
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Creative Awards</title>
<link href="app.css" rel="stylesheet">
<link href="select.css" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <div class="brand-mark">CA</div>
  <h1 class="brand-title">Creative Awards</h1>
</header>

<div class="toolbar">
  <span class="lable">Category:</span>
  <select class="cat-select" id="catSelect" aria-label="Select category">
    <option value="">Loading…</option>
  </select>
  
  <span class="flex-1"></span>
  <button class="icon-btn" id="refreshAll" type="button" aria-label="Refresh all">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
      <path d="M21 3v5h-5" />
    </svg>
  </button>
</div>
<nav class="tabs" role="tablist">
  <button class="tab active" role="tab" data-tab="nominees">Nominees</button>
  <button class="tab" role="tab" data-tab="packages">Packages</button>
  <button class="tab" role="tab" data-tab="sponsors">Sponsors</button>
</nav>

<main class="app-main" id="main">
<div id="tabContent"></div>
</main>

<footer class="app-footer">
  <span id="statCount">— nominees</span>
  <span class="dot"></span>
  <span id="statVotes">— votes</span>
  <span class="dot"></span>
  <span id="statUpdated">—</span>
  <span id="freeVoteSlot"></span>
</footer>

<div class="toast" id="toast" role="status"></div>

<!-- Normalizer must load before the app script -->
<script src="normalizer.js"></script>
<script src="select.js"></script>
<script src="app.js"></script>

</body>
</html>
