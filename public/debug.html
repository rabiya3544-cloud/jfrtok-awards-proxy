<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Debug · Creative Awards Proxy</title>
<style>
  :root{
    --bg:#09090b; --panel-2:#17171c; --panel-3:#1d1d24; --line:#26262d;
    --text:#f4f4f5; --muted:#a1a1aa; --dim:#71717a;
    --accent:#ff6b2c; --accent-2:#ffb020;
    --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
    --radius-sm:9px;
    --shadow-card:0 1px 0 rgba(255,255,255,.05) inset,0 -1px 0 rgba(0,0,0,.55) inset,0 4px 0 -2px #08080a,0 10px 18px -12px rgba(0,0,0,.9);
    --shadow-shell:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.7) inset,0 7px 0 -3px #08080a,0 16px 26px -16px rgba(0,0,0,.95);
    --shadow-press:0 1px 0 rgba(255,255,255,.04) inset,0 2px 0 -2px #08080a,0 5px 10px -8px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% -10%,#1a1310 0%,transparent 60%),radial-gradient(90% 60% at 100% 110%,#101018 0%,transparent 55%),var(--bg);
    color:var(--text);
    font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }

  .app-header{
    flex:none;display:flex;align-items:center;gap:8px;
    padding:calc(9px + env(safe-area-inset-top)) 10px 9px;
    background:linear-gradient(180deg,#17171d,#0e0e12);
    border-bottom:1px solid var(--line);box-shadow:var(--shadow-shell);
    position:relative;z-index:3;
  }
  .brand-mark{
    width:26px;height:26px;flex:none;display:grid;place-items:center;
    border-radius:8px;font-size:9px;font-weight:800;letter-spacing:.4px;color:#140a02;
    background:linear-gradient(145deg,var(--accent-2),var(--accent));
    box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -2px 0 rgba(0,0,0,.35) inset,0 4px 0 -2px #4a1c05,0 8px 14px -8px rgba(255,107,44,.8);
  }
  .brand-text{flex:1;min-width:0}
  .brand-text h1{margin:0;font-size:13.5px;font-weight:800;letter-spacing:-.1px}
  .brand-text p{margin:1px 0 0;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .btn{
    display:inline-flex;align-items:center;gap:5px;padding:7px 11px;
    font:inherit;font-size:11px;font-weight:700;color:#140a02;
    background:linear-gradient(180deg,var(--accent-2),var(--accent));
    border:1px solid #ff8a53;border-radius:9px;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 -2px 0 rgba(0,0,0,.3) inset,0 4px 0 -2px #4a1c05,0 9px 16px -10px rgba(255,107,44,.9);
    cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
  .btn[disabled]{opacity:.6;pointer-events:none}

  .icon-btn{
    width:26px;height:26px;flex:none;display:grid;place-items:center;padding:0;
    color:var(--muted);background:linear-gradient(180deg,#23232b,#181820);
    border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow-card);cursor:pointer;
    transition:transform .12s ease,color .12s ease;
  }
  .icon-btn:hover{color:var(--text)}
  .icon-btn:active{transform:translateY(1px);box-shadow:var(--shadow-press)}
  .icon-btn.busy{color:var(--accent-2);pointer-events:none}
  .icon-btn.busy svg{animation:spin .8s linear infinite}

  .app-main{
    flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:8px 10px 14px;
    box-shadow:inset 0 14px 22px -20px rgba(0,0,0,.95),inset 0 -14px 22px -20px rgba(0,0,0,.95);
  }
  .app-main::-webkit-scrollbar{width:6px}
  .app-main::-webkit-scrollbar-thumb{background:#2a2a33;border-radius:999px}

  /* summary chips */
  .summary{
    display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:4px;padding:4px 8px;
    font-size:10.5px;font-weight:700;color:var(--muted);
    background:linear-gradient(180deg,var(--panel-2),#101015);
    border:1px solid var(--line);border-radius:999px;
    box-shadow:var(--shadow-card);
  }
  .chip b{color:var(--text);font-weight:800}
  .chip.ok b{color:var(--ok)}
  .chip.bad b{color:var(--bad)}
  .chip.warn b{color:var(--warn)}

  /* result card */
  .test{
    margin-bottom:8px;border-radius:var(--radius-sm);
    background:linear-gradient(180deg,var(--panel-2),#101015);
    border:1px solid var(--line);box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .test.match{ border-color:#1f5130; }
  .test.mismatch{ border-color:#5c1e1e; }
  .test.error{ border-color:#5c3a12; }

  .test-head{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;border-bottom:1px solid var(--line);
  }
  .test-name{
    font-size:12px;font-weight:800;flex:1;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .match-badge{
    display:inline-flex;align-items:center;gap:3px;
    padding:2px 7px;border-radius:999px;
    font-size:9.5px;font-weight:800;letter-spacing:.2px;
    white-space:nowrap;
  }
  .match-badge.yes{color:#03110a;background:linear-gradient(180deg,#4ade80,#22c55e)}
  .match-badge.no {color:#fff;background:linear-gradient(180deg,#ef4444,#b91c1c)}
  .match-badge.err{color:#140a02;background:linear-gradient(180deg,#fbbf24,#f59e0b)}

  .test-body{padding:8px 10px 10px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .col{
    padding:8px;border-radius:7px;
    background:rgba(255,255,255,.02);
    border:1px solid #202028;
  }
  .col-title{
    font-size:9px;font-weight:800;letter-spacing:.5px;
    text-transform:uppercase;color:var(--dim);margin-bottom:5px;
  }
  .kv{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;line-height:1.6}
  .kv span{color:var(--dim)}
  .kv b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .kv b.ok{color:var(--ok)}
  .kv b.bad{color:var(--bad)}
  .kv b.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}

  .actions{
    display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;
  }
  .mini-btn{
    display:inline-flex;align-items:center;gap:3px;
    padding:4px 8px;font:inherit;font-size:10px;font-weight:700;
    color:var(--muted);background:linear-gradient(180deg,#23232b,#181820);
    border:1px solid var(--line);border-radius:6px;cursor:pointer;
    text-decoration:none;transition:transform .1s ease,color .1s ease;
  }
  .mini-btn:hover{color:var(--text)}
  .mini-btn:active{transform:translateY(1px)}

  .samples{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .samples[hidden]{display:none !important}
  .sample-row{
    border-radius:7px;overflow:hidden;
    background:#0c0c11;border:1px solid #1e1e26;
  }
  .sample-title{
    padding:5px 8px;font-size:9px;font-weight:800;letter-spacing:.5px;
    text-transform:uppercase;color:var(--dim);
    background:#121218;border-bottom:1px solid #1e1e26;
  }
  .sample{
    margin:0;padding:8px;
    max-height:180px;overflow:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9.5px;line-height:1.45;color:#c7c7cf;
    white-space:pre-wrap;word-break:break-all;
  }
  .sample::-webkit-scrollbar{width:5px;height:5px}
  .sample::-webkit-scrollbar-thumb{background:#2a2a33;border-radius:999px}

  .err-line{
    padding:6px 8px;font-size:10px;color:#fca5a5;
    background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);
    border-radius:6px;margin-top:6px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    word-break:break-all;
  }

  .app-footer{
    flex:none;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:7px 12px calc(7px + env(safe-area-inset-bottom));
    font-size:10px;font-weight:600;color:var(--dim);
    background:linear-gradient(0deg,#17171d,#0e0e12);
    border-top:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 -7px 0 -3px #08080a,0 -16px 26px -18px rgba(0,0,0,.95);
    white-space:nowrap;overflow:hidden;
  }
  .app-footer .dot{width:3px;height:3px;border-radius:50%;background:#3a3a44;flex:none}
  .app-footer b{color:var(--text);font-weight:700}

  .toast{
    position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));
    transform:translate(-50%,12px);z-index:20;padding:8px 12px;
    font-size:11px;font-weight:600;color:#fff;
    background:#1b1b22;border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow-card);opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  .skeleton{
    height:140px;margin-bottom:8px;border-radius:var(--radius-sm);
    background:linear-gradient(90deg,#17171c 25%,#22222b 37%,#17171c 63%);
    background-size:400% 100%;animation:shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

  @media (min-width:640px){
    .cols{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand-mark">DBG</div>
  <div class="brand-text">
    <h1>Proxy Debug</h1>
    <p id="status">Checking byte-for-byte mirror…</p>
  </div>
  <button id="runAll" class="btn" type="button">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
      <path d="M21 3v5h-5"/>
    </svg>
    <span>Run All</span>
  </button>
</header>

<main class="app-main" id="main">
  <div class="summary" id="summary"></div>
  <div id="results"></div>
</main>

<footer class="app-footer">
  <span id="statMatch">—</span>
  <span class="dot"></span>
  <span id="statTime">—</span>
  <span class="dot"></span>
  <span id="statUpdated">—</span>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const resultsEl = $('results');
  const summaryEl = $('summary');
  const statusEl = $('status');
  const runAllBtn = $('runAll');
  const statMatch = $('statMatch');
  const statTime = $('statTime');
  const statUpdated = $('statUpdated');
  const toastEl = $('toast');

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtBytes = (n) => (typeof n === 'number')
    ? (n < 1024 ? n + ' B' : (n/1024).toFixed(1) + ' KB')
    : '—';
  const fmtNum = (n) => (typeof n === 'number') ? n.toLocaleString('en-US') : '—';
  const timeStr = (d = new Date()) => d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  function classify(r) {
    if (!r.upstream || !r.proxy) return 'error';
    if (r.upstream.error || r.proxy.error) return 'error';
    if (!r.match) return 'mismatch';
    return 'match';
  }

  function badge(r) {
    const c = classify(r);
    if (c === 'match')    return '<span class="match-badge yes">✓ match</span>';
    if (c === 'mismatch') return '<span class="match-badge no">✗ mismatch</span>';
    return '<span class="match-badge err">⚠ error</span>';
  }

  function kv(label, val, cls) {
    return `<div class="kv"><span>${esc(label)}</span><b class="${cls || ''}">${val}</b></div>`;
  }

  function sideHTML(side, other) {
    if (!side) return '<div class="kv"><span>no data</span></div>';
    const statusCls = side.ok ? 'ok' : 'bad';
    const shaShort = side.sha ? side.sha.slice(0, 12) : '—';
    const shaCls = (other && other.sha && side.sha !== other.sha) ? 'bad' : '';
    const sizeCls = (other && side.bytes !== other.bytes) ? 'bad' : '';
    return [
      kv('status', side.status || '—', statusCls),
      kv('time', side.ms + ' ms', ''),
      kv('size', fmtBytes(side.bytes), sizeCls),
      kv('sha', shaShort, 'mono ' + shaCls),
      side.error ? `<div class="err-line">${esc(side.error)}</div>` : '',
    ].join('');
  }

  function cardHTML(r) {
    const cls = classify(r);
    const clsName = cls === 'match' ? 'match' : cls === 'mismatch' ? 'mismatch' : 'error';
    const expanded = !!r._expanded;

    const upSample = r.upstream && r.upstream.sample
      ? esc(r.upstream.sample)
      : (r.upstream && r.upstream.error ? esc(r.upstream.error) : '—');
    const pxSample = r.proxy && r.proxy.sample
      ? esc(r.proxy.sample)
      : (r.proxy && r.proxy.error ? esc(r.proxy.error) : '—');

    return `
    <article class="test ${clsName}" data-endpoint="${esc(r.name)}">
      <header class="test-head">
        <span class="test-name">${esc(r.name)}</span>
        ${badge(r)}
        <button class="icon-btn expand-toggle" type="button" aria-label="Toggle samples">▾</button>
      </header>
      <div class="test-body">
        <div class="cols">
          <div class="col">
            <div class="col-title">Upstream</div>
            ${sideHTML(r.upstream, r.proxy)}
          </div>
          <div class="col">
            <div class="col-title">Proxy</div>
            ${sideHTML(r.proxy, r.upstream)}
          </div>
        </div>
        <div class="actions">
          <button class="mini-btn" type="button" data-action="retest">↻ Retest</button>
          <a class="mini-btn" href="${esc(r.upstreamUrl)}" target="_blank" rel="noopener">↗ Upstream</a>
          <a class="mini-btn" href="${esc(r.proxyUrl)}" target="_blank" rel="noopener">↗ Proxy</a>
          <button class="mini-btn" type="button" data-action="toggle-samples">${expanded ? '▴ Hide' : '▾ Samples'}</button>
        </div>
        <div class="samples" ${expanded ? '' : 'hidden'}>
          <div class="sample-row">
            <div class="sample-title">Upstream · first ${r.upstream?.sample ? Math.min(r.upstream.sample.length, 800) : 0} chars</div>
            <pre class="sample">${upSample}</pre>
          </div>
          <div class="sample-row">
            <div class="sample-title">Proxy · first ${r.proxy?.sample ? Math.min(r.proxy.sample.length, 800) : 0} chars</div>
            <pre class="sample">${pxSample}</pre>
          </div>
        </div>
      </div>
    </article>`;
  }

  function renderSummary(data) {
    const total = data.count;
    const matches = data.results.filter((r) => r.match).length;
    const mism = data.results.filter((r) => classify(r) === 'mismatch').length;
    const errs = data.results.filter((r) => classify(r) === 'error').length;

    summaryEl.innerHTML = `
      <span class="chip ${data.allMatch ? 'ok' : (mism ? 'bad' : 'warn')}">
        <b>${matches}/${total}</b> match
      </span>
      ${mism ? `<span class="chip bad"><b>${mism}</b> mismatch</span>` : ''}
      ${errs ? `<span class="chip warn"><b>${errs}</b> error</span>` : ''}
      <span class="chip"><b>${fmtNum(data.totalMs)}</b> ms total</span>
      <span class="chip mono" title="${esc(data.generatedAt)}">${timeStr(new Date(data.generatedAt))}</span>
    `;

    statMatch.innerHTML = data.allMatch
      ? `<b style="color:var(--ok)">all match</b>`
      : `<b style="color:var(--bad)">${mism + errs} issue${mism+errs===1?'':'s'}</b>`;
    statTime.innerHTML = `<b>${fmtNum(data.totalMs)}</b> ms`;
    statUpdated.innerHTML = `updated <b>${timeStr(new Date(data.generatedAt))}</b>`;
    statusEl.textContent = data.allMatch
      ? `all ${total} endpoints match upstream byte-for-byte`
      : `${matches}/${total} match · ${mism} mismatch · ${errs} error`;
  }

  function renderAll(data) {
    renderSummary(data);
    resultsEl.innerHTML = data.results.map(cardHTML).join('');
  }

  function renderSkeleton() {
    resultsEl.innerHTML = Array.from({length:6}, () => '<div class="skeleton"></div>').join('');
    summaryEl.innerHTML = '';
    statusEl.textContent = 'Running…';
    statMatch.textContent = '—';
    statTime.textContent = '—';
    statUpdated.textContent = '—';
  }

  async function runAll() {
    runAllBtn.disabled = true;
    runAllBtn.querySelector('span').textContent = 'Running…';
    renderSkeleton();
    try {
      const res = await fetch('/api/debug?t=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      // remember expand states
      const expanded = new Set(
        [...resultsEl.querySelectorAll('.test')]
          .filter((el) => !el.querySelector('.samples').hidden)
          .map((el) => el.dataset.endpoint)
      );
      data.results.forEach((r) => { r._expanded = expanded.has(r.name); });
      renderAll(data);
    } catch (err) {
      resultsEl.innerHTML = `<div class="test error"><div class="test-body">
        <div class="err-line">${esc(err.message)}</div>
      </div></div>`;
      statusEl.textContent = 'Failed';
      toast(err.message);
    } finally {
      runAllBtn.disabled = false;
      runAllBtn.querySelector('span').textContent = 'Run All';
    }
  }

  async function retestOne(endpoint, card) {
    const btn = card.querySelector('[data-action="retest"]');
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const res = await fetch(`/api/debug?endpoint=${encodeURIComponent(endpoint)}&t=${Date.now()}`,
        { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      const fresh = data.results[0];
      fresh._expanded = !card.querySelector('.samples').hidden;
      const wrapper = document.createElement('div');
      wrapper.innerHTML = cardHTML(fresh);
      card.replaceWith(wrapper.firstElementChild);
      // re-render summary counts
      const all = [...resultsEl.querySelectorAll('.test')].length;
      const matches = [...resultsEl.querySelectorAll('.test')]
        .filter((el) => el.classList.contains('match')).length;
      summaryEl.querySelector('.chip').innerHTML =
        `<b>${matches}/${all}</b> match`;
      statMatch.innerHTML = matches === all
        ? `<b style="color:var(--ok)">all match</b>`
        : `<b style="color:var(--bad)">${all - matches} issue${all - matches === 1 ? '' : 's'}</b>`;
      toast(`${endpoint} · ${fresh.match ? 'match' : 'mismatch'}`);
    } catch (err) {
      toast(err.message);
      btn.disabled = false;
      btn.textContent = '↻ Retest';
    }
  }

  // event delegation
  resultsEl.addEventListener('click', (e) => {
    const card = e.target.closest('.test');
    if (!card) return;

    if (e.target.closest('.expand-toggle') ||
        e.target.closest('[data-action="toggle-samples"]')) {
      const box = card.querySelector('.samples');
      box.hidden = !box.hidden;
      const mini = card.querySelector('[data-action="toggle-samples"]');
      mini.textContent = box.hidden ? '▾ Samples' : '▴ Hide';
      card.querySelector('.expand-toggle').textContent = box.hidden ? '▾' : '▴';
      return;
    }

    if (e.target.closest('[data-action="retest"]')) {
      retestOne(card.dataset.endpoint, card);
      return;
    }
  });

  runAllBtn.addEventListener('click', runAll);

  // initial run
  runAll();
})();
</script>
</body>
</html>
