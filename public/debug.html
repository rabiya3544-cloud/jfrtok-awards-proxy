<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Debug · Creative Awards Proxy</title>
<link href="debug.css" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <div class="brand-mark">DBG</div>
  <div class="brand-text">
    <h1>Debug · Creative Awards Proxy</h1>
    <p id="status">Initializing…</p>
  </div>
  <button id="runBtn" class="btn" type="button">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
      <path d="M21 3v5h-5"/>
    </svg>
    <span id="runBtnLabel">Run Proxy</span>
  </button>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="proxy" role="tab">Proxy Mirror</button>
  <button class="tab" data-tab="norm" role="tab">Normalization</button>
</nav>

<main class="app-main" id="main">

  <section class="tab-panel active" data-tab="proxy" role="tabpanel">
    <div class="summary" id="proxySummary"></div>
    <div id="proxyResults"></div>
  </section>

  <section class="tab-panel" data-tab="norm" role="tabpanel">
    <div class="summary" id="normSummary"></div>
    <div id="normResults">
      <div style="padding:24px 12px;text-align:center;font-size:11px;color:var(--dim)">
        Not run yet — click <b style="color:var(--text)">Run Normalization</b> above.
      </div>
    </div>
  </section>

</main>

<footer class="app-footer">
  <span id="statA">—</span>
  <span class="dot"></span>
  <span id="statB">—</span>
  <span class="dot"></span>
  <span id="statC">—</span>
</footer>

<div class="toast" id="toast" role="status"></div>

<script src="normalizer.js"></script>
<script src="debug.js"></script>

</body>
</html>
